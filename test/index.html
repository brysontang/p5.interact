<html lang="en">
  <head>

    <title>p5.interact tests</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; margin: 24px 32px; color: #1b1b1b; }

      #summary { font-weight: 600; margin: 8px 0 16px; }
      ul { list-style: none; padding: 0; }
      li { padding: 3px 8px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }

      .pass { color: #2a9d5c; } .fail { color: #c62828; }
